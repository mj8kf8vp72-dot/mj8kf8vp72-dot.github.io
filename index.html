<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="入試クイズ">
<title>静岡県公立高校入試 対策クイズ</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--ink:#1b2a32;--sub:#5b6d77;--ac:#1d6e8c;--on:#fff;--ok:#1b8a4b;--ng:#c0392b;--ln:#cfdbe1;--gr:#e3edf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181c;--card:#1b242a;--ink:#e7eef1;--sub:#93a5ae;--ac:#5cb5d2;--on:#0d1a20;--ok:#5ec98b;--ng:#ef7d6f;--ln:#33424b;--gr:#25313a}}
:root[data-theme="dark"]{--bg:#12181c;--card:#1b242a;--ink:#e7eef1;--sub:#93a5ae;--ac:#5cb5d2;--on:#0d1a20;--ok:#5ec98b;--ng:#ef7d6f;--ln:#33424b;--gr:#25313a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:1.3rem;margin:8px 0}h2{font-size:1.05rem;margin:18px 0 6px}
.sub{color:var(--sub);margin:12px 0 4px;font-size:.88rem}.note{font-size:.88rem;color:var(--sub)}
.nav{display:flex;gap:8px}.nav button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:1.5px solid var(--ln);background:var(--card);color:var(--sub);border-radius:999px;padding:6px 14px;min-height:44px}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.main,.alt{font:inherit;width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--ac);padding:10px 16px;font-weight:700;margin-top:12px}
.main{background:var(--ac);color:var(--on)}.alt{background:transparent;color:var(--ac)}.main:disabled{opacity:.4}
.card{background-color:var(--card);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:20px 20px;border:1.5px solid var(--ln);border-radius:10px;padding:16px;margin:12px 0}
.tag{font-size:.8rem;color:var(--sub);margin:0 0 6px}.q{font-size:1.05rem;margin:0}
.bar{height:6px;background:var(--gr);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input,textarea{font:inherit;width:100%;min-height:48px;border:1.5px solid var(--ln);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;font:inherit;min-height:48px;margin-top:8px;padding:10px 14px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}
.fb{margin:12px 0 4px;font-weight:700}.ex{margin:0;padding:10px 12px;border-left:4px solid var(--ac);background:var(--card)}
.good{color:var(--ok)}.bad{color:var(--ng)}.score{font-size:2.2rem;font-weight:700;margin:4px 0}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--ln);padding:6px 4px;text-align:left}
.hero{background:linear-gradient(135deg,var(--ac),#2a8fb0);color:var(--on);border-radius:20px;padding:20px;margin:12px 0}.hero h2{margin:4px 0;font-size:1.3rem;color:inherit}.hero p{margin:0;opacity:.9;font-size:.9rem}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:12px 16px;margin:12px 0}.count b{font-size:1.4rem;color:var(--ac)}.count small{color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{font:inherit;text-align:left;background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:14px;color:var(--ink);min-height:120px}.tile span{font-size:1.6rem}.tile b{display:block;margin:6px 0 2px}.tile small{color:var(--sub)}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sb{font:inherit;background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:10px 2px;color:var(--ink);text-align:center;font-size:.8rem}.sb span{display:block;font-size:1.5rem}.sb:disabled{opacity:.45}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat div{background:var(--gr);border-radius:12px;padding:10px 4px}.stat b{font-size:1.4rem;display:block}.stat small{color:var(--sub)}
</style></head><body><div id="app"></div>
<script>
const SUB={国語:['漢字・語句','文法','読解','古典'],数学:['計算','関数','図形','確率・データ'],英語:['文法','語彙','読解'],理科:['物理','化学','生物','地学'],社会:['歴史','地理','公民']};/* 他の教科は、ここに 国語:['漢字・語句','読解'] のように分野を足す */
const LV=['やさしい','ふつう','むずかしい'];
/* 問題の追加: 下の形式で1行ずつ足す。[ID,教科,分野,難易度(1-3),年度または「類似問題」,問題文,[正答,...],選択肢(なければ0),単位,解説]  IDは重複させない */
const D=[
['r6-1','理科','生物',1,'令和6年度','エンドウの丸形としわ形のように、どちらか一方の形質しか現れない2つの形質どうしを何というか。',['対立形質'],0,'','丸としわのように、どちらか一方しか現れない形質どうしを対立形質という。'],
['r6-2','理科','生物',1,'令和6年度','ネズミのように、子が親の体内である程度育ってからうまれる子のうまれ方を、一般に何というか。',['胎生'],0,'','子が母親の体内である程度育ってからうまれるふえ方が胎生。卵でうまれるのは卵生。'],
['r6-3','理科','生物',2,'令和6年度','1日に消費するエネルギー2400kcalのうち20%が脳で消費される。ご飯100gから得られるエネルギーを150kcalとすると、脳の1日の消費エネルギーはご飯何g分か。',['320'],0,'g','脳で使う量は2400×0.2=480kcal。ご飯100gが150kcalなので、480÷150×100=320g。'],
['r6-4','理科','化学',2,'令和6年度','黒色の酸化銅8.0gと炭素粉末1.5gを混ぜて加熱したところ、反応後の試験管の中の固体は7.3gだった。発生した二酸化炭素は何gか。',['2.2'],0,'g','反応前の合計は8.0+1.5=9.5g。減った分が出ていった二酸化炭素なので、9.5−7.3=2.2g。'],
['r6-5','理科','地学',1,'令和6年度','地球の自転による、太陽の見かけの動きを何というか。',['日周運動'],0,'','地球の自転による天体の見かけの動きが日周運動。公転によるものは年周運動。'],
['r6-6','理科','物理',2,'令和6年度','質量3kgの荷物を、定滑車1つを用いて80cmの高さまでゆっくり一定の速さで真上に持ち上げた。手が加えた力がした仕事は何Jか。100gの物体にはたらく重力を1Nとし、摩擦は考えない。',['24'],0,'J','3kgの重力は30N。仕事=力×距離=30N×0.8m=24J。定滑車は力の向きを変えるだけで、力の大きさは変わらない。'],
['r6-7','理科','物理',2,'令和6年度','1秒に50回打点する記録タイマーで台車の運動を記録した。a点からb点(15打点目)までの長さは22.5cmだった。この間の台車の平均の速さは何cm/sか。',['75'],0,'cm/s','15打点にかかる時間は15÷50=0.3秒。平均の速さ=22.5cm÷0.3s=75cm/s。'],
['r6-8','理科','物理',3,'令和6年度','定滑車1つの装置で荷物を持ち上げたときと比べ、動滑車を3つ連ねた装置で同じ荷物を同じ高さまで持ち上げると、手が糸を引く力の大きさは何倍になるか。糸や滑車の質量・摩擦は考えない。',['1/8','0.125'],0,'倍','動滑車1つで力は半分(引く距離は2倍)。3つ連ねると力は1/2×1/2×1/2=1/8倍、距離は8倍。仕事の大きさは変わらない(仕事の原理)。'],
['r7-1','理科','化学',1,'令和7年度','原子が電子を失ったり受けとったりして、＋または－の電気を帯びたものを何というか。',['イオン'],0,'','原子が電子を失うと＋、受けとると－の電気を帯びる。この状態のものをイオンという。'],
['r7-2','理科','生物',1,'令和7年度','イヌワラビはなかまをふやすために、種子ではなく何をつくるか。',['胞子'],0,'','イヌワラビなどのシダ植物は種子をつくらず、胞子でふえる。'],
['r7-3','理科','生物',1,'令和7年度','葉の表皮にある、三日月形の2つの細胞に囲まれたすきまを何というか。',['気孔'],0,'','三日月形の2つの孔辺細胞に囲まれたすきまが気孔。気体の出入り口としてはたらく。'],
['r7-4','理科','地学',1,'令和7年度','恒星が数十億個から数千億個も集まった集団を何というか。',['銀河'],0,'','恒星が数十億〜数千億個集まった集団が銀河。太陽系は天の川銀河(銀河系)にある。'],
['r7-5','理科','地学',1,'令和7年度','地震で、岩盤の破壊によって大地にできるずれを何というか。',['断層'],0,'','岩盤が破壊されてできた大地のずれが断層。'],
['r7-6','理科','化学',3,'令和7年度','酸化銀12gを加熱した。試験管の質量は20gで、P班(十分に加熱)は試験管全体が32.0gから31.2gになった。P班でできた銀の質量は、発生した酸素の質量の何倍か。',['14'],0,'倍','酸化銀→銀+酸素。酸素=32.0−31.2=0.8g、銀=12−0.8=11.2g。11.2÷0.8=14倍。'],
['r7-7','理科','化学',3,'令和7年度','前問の実験で、Q班(加熱が不十分)は試験管全体が32.0gから31.5gになった。Q班の試験管に残った未反応の酸化銀は何gか。',['4.5'],0,'g','発生した酸素は32.0−31.5=0.5g。銀:酸素=14:1なので、反応した酸化銀は酸素の15倍の7.5g。残りは12−7.5=4.5g。'],
['r7-8','理科','物理',2,'令和7年度','質量120gのおもりを月面に持っていった。月面での重力は地球上の6分の1で、地球上で100gの物体にはたらく重力を1Nとする。月面でおもりにはたらく重力は何Nか。',['0.2'],0,'N','地球上で120gの重力は1.2N。月面では1/6なので1.2÷6=0.2N。(質量は月でも120gのまま)'],
['r8-1','理科','生物',1,'令和8年度','ヒトの目や耳のような、外界からの刺激を受けとる体の部分を、一般に何というか。',['感覚器官','感覚器'],0,'','光や音などの刺激を受けとる目・耳・鼻・舌・皮膚などを感覚器官という。'],
['r8-2','理科','物理',3,'令和8年度','100Vの電圧を加えたときの消費電力が10Wの充電器で、スマートフォンに10800Jの電力量を充電する。充電器の消費電力の75%が充電されるとき、かかる時間は何分か。',['24'],0,'分','充電される電力は10W×0.75=7.5W。10800J÷7.5W=1440秒=24分。'],
['r8-3','理科','生物',1,'令和8年度','細胞の染色体に含まれている、遺伝子の本体の物質を、一般に何というか。',['DNA','デオキシリボ核酸'],0,'','遺伝子の本体はDNA(デオキシリボ核酸)。'],
['r8-4','理科','化学',1,'令和8年度','石油から粗製ガソリン(ナフサ)をとり出すように、液体を加熱して一度気体にし、その気体を冷やして再び液体にして集める方法を何というか。',['蒸留'],0,'','液体を加熱して気体にし、冷やして液体にして集める方法が蒸留。沸点のちがいを利用して分ける。'],
['r8-5','理科','化学',1,'令和8年度','次のうち、有機物はどれか。',['メタン'],['食塩','ガラス','硫黄','メタン'],'','炭素をふくむ物質が有機物。メタン(CH₄)は炭素をふくむが、食塩・ガラス・硫黄はふくまない。'],
['r8-6','理科','化学',3,'令和8年度','水酸化バリウム水溶液100cm³にうすい硫酸を加える。硫酸6cm³のとき沈殿は1.8gで、8cm³で中性になった。硫酸を12cm³加えたとき、沈殿は何gか。',['2.4'],0,'g','混ぜた時点から中和は起こり、中性になる8cm³までは硫酸が全部反応して、沈殿は硫酸の量に比例する。6cm³で1.8gなら1cm³で0.3g、8cm³で2.4g。8cm³を超えた分は反応する相手がないので、12cm³でも2.4gのまま。'],
['r8-7','理科','地学',1,'令和8年度','火星や地球のような、太陽のまわりを公転している天体を、一般に何というか。',['惑星'],0,'','太陽のまわりを公転する天体が惑星。'],
['r8-8','理科','物理',1,'令和8年度','太い弦に質量200gのおもりを4個つるした。おもりが弦を引く力の大きさは何Nか。100gの物体にはたらく重力を1Nとする。',['8'],0,'N','おもりの質量は200g×4=800g。100gの重力が1Nなので、800gは8N。'],
['r6-s1','社会','歴史',1,'令和6年度','聖徳太子らが行った政治改革で定められた、天皇の命令に従うことなど、役人の心構えを示した法を何というか。',['十七条の憲法','憲法十七条','十七条憲法'],0,'','604年に聖徳太子が定めた、役人の心構えを示したもの。「和をもって貴しとなす」で始まる。'],
['r6-s2','社会','歴史',2,'令和6年度','普通選挙法と同じ年に制定された、共産主義や社会運動を取りしまりの対象とした法律を何というか。',['治安維持法'],0,'','1925年、普通選挙法と同時に治安維持法が制定された。選挙権が広がる一方で、社会運動の取りしまりが強められた。'],
['r6-s3','社会','地理',1,'令和6年度','中部地方にある、飛驒・木曽・赤石の3つの山脈の総称で、ヨーロッパの山脈にちなんだ名前を何というか。',['日本アルプス'],0,'','標高3000m前後の飛驒・木曽・赤石山脈を、ヨーロッパのアルプス山脈にちなんで日本アルプスという。'],
['r6-s4','社会','地理',1,'令和6年度','施設園芸で、ビニールハウスなどを利用して出荷時期を早める工夫をした栽培方法を何というか。',['促成栽培'],0,'','出荷時期を早める栽培が促成栽培(宮崎県や高知県のピーマン・なすなど)。反対に、遅らせるのが抑制栽培。'],
['r6-s5','社会','公民',1,'令和6年度','銀行は、融資する相手から返済にあたって(　)を受け取り、預金者に(　)を支払う。その差が銀行の収入になる。(　)に当てはまる語を書きなさい。',['利子','利息'],0,'','銀行は貸した相手から利子(利息)を受け取り、預金者にも利子を払う。貸す側が受け取る利子のほうが高く、その差が収入になる。'],
['r7-s1','社会','歴史',1,'令和7年度','律令制のもとで、6年ごとにつくられる戸籍に登録された6歳以上の人々にあたえられた田を何というか。',['口分田'],0,'','戸籍に登録された6歳以上の人々に口分田があたえられ、死ぬと国に返された(班田収授法)。'],
['r7-s2','社会','歴史',2,'令和7年度','鎌倉幕府の執権北条泰時が定めた、武家社会の慣習に基づき政治や裁判の基準などをまとめた法を何というか。',['御成敗式目','貞永式目'],0,'','1232年に北条泰時が定めた、最初の武家法。源頼朝以来の先例や武士の慣習が基準になった。'],
['r7-s3','社会','地理',1,'令和7年度','四国や本州の南岸に沿って流れていく暖流を何というか。',['黒潮','日本海流'],0,'','日本列島の南岸を北上する暖流が黒潮(日本海流)。日本海側には対馬海流が流れる。'],
['r7-s4','社会','公民',2,'令和7年度','日本国憲法第9条2項は「陸海空軍その他の(　)は、これを保持しない。」と定めている。(　)に当てはまる語を書きなさい。',['戦力'],0,'','第9条2項は、戦力の不保持と、国の交戦権の否認を定めている。'],
['r7-s5','社会','公民',1,'令和7年度','道路、公園、学校などのように、人々の生活や産業の基盤となる公共施設を何というか。',['社会資本'],['社会資本','社会福祉','公共事業','公共の福祉'],'','道路・公園・学校・水道などの基盤となる施設が社会資本。社会福祉は、生活を支える制度やサービス。'],
['r8-s1','社会','歴史',1,'令和8年度','天皇や貴族、農民や防人などが作った歌を収めた歌集で、大伴家持によりまとめられたといわれるものは何か。',['万葉集'],0,'','奈良時代にまとめられた、現存する日本最古の歌集。約4500首の歌が収められている。'],
['r8-s2','社会','歴史',2,'令和8年度','室町幕府で、将軍の補佐役として置かれ、有力な守護大名が任命された地位を何というか。',['管領'],0,'','管領は将軍を助けて政治を行う役職。細川・斯波・畠山の3氏が交代で任命された。'],
['r8-s3','社会','地理',1,'令和8年度','志摩半島のように、海岸線が複雑に入り組んだ地形を何というか。',['リアス海岸'],0,'','山地が沈んで谷に海水が入りこんでできた地形。志摩半島のほか、三陸海岸なども代表例。'],
['r8-s4','社会','地理',1,'令和8年度','ブラジルのように、特定の農産物や鉱産資源の輸出に頼る経済を何というか。',['モノカルチャー経済','モノカルチャー'],0,'','特定の産物の輸出に頼る経済。価格が下がったり、不作になったりすると、収入が不安定になりやすい。'],
['r8-s5','社会','公民',1,'令和8年度','訪問販売や電話勧誘などの特定の取り引きで商品を購入した場合、一定の期間内であれば契約を解除できる制度を何というか。',['クーリング・オフ','クーリングオフ'],0,'','一定の期間内なら、消費者が一方的に契約を解除できる制度。'],

const MSG=['一問ずつ、できるを増やそう。','今日の1問が、合格への一歩。','昨日より、ひとつ多くできる自分に。','間違えた問題は、伸びしろ。','3問だけでも、立派な勉強。','通学の5分が、力になる。','今日はここまで、でもOK。続けた人が強い。','過去問は、本番のリハーサル。','本番の自分に、自信をプレゼントしよう。','解けなかった問題が、合格を連れてくる。','清良なら、まだまだ伸びる！|今日の頑張りを大切に','焦らず、一歩ずつ','未来は今の積み重ね|清良の可能性を信じてる'];
function home(){let N=0,Cc=0,w=0;D.forEach(r=>{const g=R.log[r[0]];if(!g)return;N+=g.n;Cc+=g.c;if(g.last===0)w++});
 $.innerHTML=`<h1>静岡高校入試トレーナー</h1><p class="note">過去問 × 類似問題トレーニング</p><div class="hero"><p>YOUR EXAM, YOUR PACE</p>${(m=>`<h2>${m[0]}</h2><p>${m[1]||'過去問で実力チェック。類似問題で苦手を克服。'}</p>`)(MSG[Math.floor(Math.random()*MSG.length)].split('|'))}</div>${cd()}<h2>学習モード</h2><div class="grid2"><button class="tile" data-a="hm" data-v="past"><span>📘</span><b>過去問モード</b><small>年度・教科を選んで演習</small></button><button class="tile" data-a="hm" data-v="sim"><span>✨</span><b>類似問題トレーニング</b><small>分野別の練習問題に挑戦</small></button></div><h2>教科から選ぶ</h2><div class="subs">${[['国語','📖'],['数学','📐'],['英語','🔤'],['理科','🧪'],['社会','🌏']].map(([s,e])=>`<button class="sb" data-a="hs" data-v="${s}" ${SUB[s]?'':'disabled'}><span>${e}</span>${s}${SUB[s]?'':'<br><small>準備中</small>'}</button>`).join('')}</div><h2>学習の記録</h2><div class="card"><div class="stat"><div><b>${N}</b><small>挑戦回数</small></div><div><b>${N?Math.round(Cc/N*100)+'%':'—'}</b><small>全体正答率</small></div><div><b>${w}</b><small>復習候補</small></div></div><button class="alt" data-a="t" data-v="r">学習履歴を見る</button></div>`}
function setup(){
 const p=pool(),n=Math.min(C.n,p.length);
 $.innerHTML=nav('q')+`<h1>静岡県公立高校入試 対策</h1><p class="sub">教科</p>${ch(o(Object.keys(SUB)),x=>x===C.s,'s')}<p class="sub">分野</p>${ch(o(['すべて',...SUB[C.s]]),x=>x==='すべて'?!C.cats.size:C.cats.has(x),'cat')}<p class="sub">問題数</p>${ch(o([3,5,10,20]).map(([a,b])=>[a,b+'問']),x=>x==C.n,'n')}<p class="sub">難易度</p>${ch([[0,'全て'],[1,'基礎'],[2,'標準']],x=>x==C.lv,'lv')}<p class="sub">問題の種類</p>${ch([['過去問','過去問'],['類似問題','類似問題(オリジナル)']],x=>C.src.has(x),'src')}<p class="sub">過去問の年度(類似問題には関係しません)</p>${ch(o(['令和6年度','令和7年度','令和8年度']),x=>C.yr.has(x),'yr')}<p class="sub">出題順</p>${ch([[0,'おまかせ(回数の少ない問題を優先)'],[1,'完全シャッフル'],[2,'順番どおり']],x=>x==C.od,'od')}<p class="sub">モード</p>${ch([[0,'短時間(タップ式・紙とペン不要)'],[1,'じっくり(入力式・紙とペンで計算)']],x=>x==C.m,'m')}<p class="note">${p.length?'条件に合う問題: '+p.length+'問'+(p.length<C.n?'。'+C.n+'問に足りないため、'+p.length+'問を出題します。':''):'この条件の問題はまだありません。'}</p><button class="main" data-a="go" ${p.length?'':'disabled'}>はじめる(${n}問)</button>`;
}
function begin(rows){L=rows;i=0;sc=0;miss=[];show()}
function pick(){const all=pool(),ls=new Set(R.last||[]),fr=all.filter(r=>!ls.has(r[0])),p=C.od===2||fr.length<C.n?all:fr;let s;if(C.od===2)s=p.slice(0,C.n);else if(C.od===1)s=shuf(p.slice()).slice(0,C.n);else s=shuf(p.map(r=>{const g=R.log[r[0]]||{};return[(g.n||0)-(g.last===0?1:0)+Math.random()*1.5,r]}).sort((a,b)=>a[0]-b[0]).slice(0,C.n).map(x=>x[1]));R.last=s.map(r=>r[0]);save();return s}
const fmt=x=>String(+x.toFixed(2)),terms=()=>D.filter(r=>!r[7]&&isNaN(r[6][0])&&r[6][0]!=='1/8').map(r=>r[6][0]);
const DS={'k6-3':['かたはらに','かたわりに','かだわらに'],'k7-3':['竹が','竹に','竹は'],'k7-5':['つたへたる','つだえたる','つたえたり'],'k8-4':['秘蔵の道具','茶事の好み','堀田加賀守'],'s-55':['そちょく','すじき','そなお'],'s-56':['しい','ゆびき','しけい'],'s-57':['借りられる','お借りになる','借りてくださる'],'s-58':['衛星','営生','衛正'],'s-59':['関心','歓心','寒心'],'s-64':['上昇','増大','加算'],'s-67':['申す','申し上げる','お言いする'],'s-68':['ご覧になる','見られる','お見えになる'],'s-71':['いふ','ゆう','いぶ'],'s-72':['けう','けふう','きゅう'],'e6-3':['hold','holding','holded'],'e6-4':['old','oldest','more old'],'e6-5':['For two years','For one year','Since last year'],'e7-5':['build','building','builded'],'e7-7':['Eight years old','Five years old','Three years old'],'e8-5':['see','saw','seen'],'e8-6':['come','comes','coming'],'s-28':['−17','7','17'],'s-29':['4a−5b','8a+5b','4a+11b'],'s-30':['6√2','5√3','4√2'],'s-31':['x=−2, x=−3','x=1, x=6','x=−1, x=−6'],'s-32':['y=12x','y=x/12','y=7/x'],'s-33':['3','2','8'],'s-34':['1≦y≦4','−1≦y≦2','0≦y≦2'],'s-35':['12π','27π','108π'],'s-36':['36π','24π','48π'],'s-37':['1/12','1/9','7/36'],'s-38':['live','living','was living'],'s-39':['build','building','builds'],'s-40':['be','being','am'],'s-41':['stands','stood','to stand'],'s-42':['who','where','what'],'s-43':['higher','high','most high'],'s-44':['liberty','laboratory','bookstore'],'s-45':['What','Where','Why'],'s-46':['あらわしい','はなはだしい','いちじるしく'],'s-47':['あたえる','あずかる','ゆだける'],'s-48':['精潔','清結','青潔'],'s-49':['丁年','定寧','丁念'],'s-52':['いただく','頂戴する','お食べする'],'s-53':['いらっしゃる','おいでになる','行かれる'],'s-11':['水酸化物イオン','塩化物イオン','ナトリウムイオン'],'s-12':['塩化水素','水酸化ナトリウム','塩化カリウム'],'s-13':['中性','アルカリ性','塩基性'],'s-15':['惑星','恒星','小惑星'],'s-16':['しわ形','丸形としわ形','どちらにもならない'],'s-17':['沸点','融点','気温'],'s-18':['地方債','社債','株式'],'s-19':['財務省','ゆうちょ銀行','世界銀行'],'s-20':['国民主権','平和主義','公共の福祉'],'s-21':['国会','裁判所','会計検査院'],'s-22':['16','20','25'],'s-23':['消費者基本法','独占禁止法','特定商取引法'],'s-24':['打ちこわし','山城国一揆','加賀の一向一揆'],'s-25':['日露戦争','日中戦争','第一次世界大戦'],'s-26':['天竜川','大井川','信濃川'],'s-27':['ナイル川','ミシシッピ川','長江'],'r6-1':['優性形質','潜性形質','純系'],'r6-2':['卵生','変態','有性生殖'],'r6-5':['年周運動','自転','公転'],'r7-1':['電子','陽子','分子'],'r7-2':['花粉','胚珠','子房'],'r7-3':['孔辺細胞','道管','師管'],'r7-4':['星座','星雲','太陽系'],'r7-5':['しゅう曲','隆起','震源'],'r8-1':['感覚神経','中枢神経','運動器官'],'r8-3':['染色体','細胞核','タンパク質'],'r8-4':['ろ過','再結晶','電気分解'],'r8-7':['恒星','衛星','小惑星'],'s-6':['火山岩','堆積岩','凝灰岩'],'r6-s1':['冠位十二階','大宝律令','御成敗式目'],'r6-s2':['普通選挙法','国家総動員法','治安警察法'],'r6-s3':['奥羽山脈','アルプス山脈','ロッキー山脈'],'r6-s4':['抑制栽培','露地栽培','輪作'],'r6-s5':['配当','手数料','税金'],'r7-s1':['荘園','墾田','位田'],'r7-s2':['武家諸法度','大宝律令','建武式目'],'r7-s3':['親潮','対馬海流','リマン海流'],'r7-s4':['軍隊','兵力','武力'],'r8-s1':['古今和歌集','新古今和歌集','日本書紀'],'r8-s2':['執権','老中','守護'],'r8-s3':['フィヨルド','砂浜海岸','三角州'],'r8-s4':['計画経済','市場経済','自給自足経済'],'r8-s5':['製造物責任法','消費者基本法','独占禁止法']};
function mk(r){
 if(r[7])return r[7];const a=r[6][0];let s;if(DS[r[0]])return shuf([a,...DS[r[0]]]);
 if(a==='1/8')return shuf(['1/2','1/4','1/8','1/6']);
 if(!isNaN(a)){const v=+a;s=new Set([a,fmt(v*2),fmt(v/2),fmt(v*10)]);if(s.size<4)s.add(fmt(v+3))}
 else s=new Set([a,...shuf(terms().filter(t=>t!==a)).slice(0,3)]);
 return shuf([...s]);
}
function show(){
 judged=false;const r=L[i],kj=r[7]==='記述',op=kj?0:C.m?r[7]:mk(r);
 $.innerHTML=`<div class="bar"><i style="width:${i/L.length*100}%"></i></div><p class="tag">${i+1} / ${L.length}</p><div class="card"><p class="tag">${r[1]}・${r[2]}(${r[4]})</p><p class="q">${r[5]}</p></div>`+(op?op.map(x=>`<button class="opt" data-a="o" data-v="${x}">${x}${r[7]?'':r[8]}</button>`).join(''):kj?`<textarea id="tx" rows="3" placeholder="答えを書く(紙に書いてもOK)"></textarea><button class="main" data-a="sh">答えを見る</button>`:`<input id="in" autocomplete="off" placeholder="答えを入力${r[8]?'(単位:'+r[8]+')':''}"><button class="main" data-a="ck">答え合わせ</button>`)+`<div id="fb"></div>`;
 const f=document.getElementById('in');if(f)f.focus();
}
function judge(v,tap){
 if(judged)return;judged=true;const r=L[i],ok=tap===2?v:tap?v===r[6][0]:same(v,r[6]),g=R.log[r[0]]||{n:0,c:0};
 g.n++;if(ok)g.c++;g.last=ok?1:0;R.log[r[0]]=g;save();
 if(ok)sc++;else miss.push(r);
 document.querySelectorAll('input,.opt,[data-a=ck]').forEach(e=>e.disabled=true);
 document.getElementById('fb').innerHTML=`<p class="fb ${ok?'good':'bad'}">${ok?'正解':'不正解'}　正答: ${r[6][0]}${r[8]}</p>${ok?'':`<p class="note">あなたの答え: ${tap===2?'(自己採点)':v}</p>`}<p class="ex">${r[9]}</p><button class="main" data-a="nx">${i+1<L.length?'次の問題':'結果を見る'}</button>`;
 document.querySelector('[data-a=nx]').focus();
}
function result(){
 $.innerHTML=`<h1>結果</h1><div class="score">${sc} / ${L.length}</div><p>正答率 ${Math.round(sc/L.length*100)}%</p>`+(miss.length?`<h2>間違えた問題</h2>`+miss.map(r=>`<div class="card"><p class="q">${r[5]}</p><p class="fb good">${r[6][0]}${r[8]}</p><p class="ex">${r[9]}</p></div>`).join('')+`<button class="main" data-a="rt">間違えた問題をもう一度解く</button>`:'<p>全問正解です。</p>')+`<button class="alt" data-a="home">最初にもどる</button>`;
}
function rec(){
 let N=0,Cc=0;const bs={},bc={};
 D.forEach(r=>{const g=R.log[r[0]];if(!g)return;N+=g.n;Cc+=g.c;for(const [b,k] of [[bs,r[1]],[bc,r[1]+'・'+r[2]]]){b[k]=b[k]||[0,0];b[k][0]+=g.n;b[k][1]+=g.c}});
 const pc=(c,n)=>n?Math.round(c/n*100)+'%':'—',wr=D.filter(r=>(R.log[r[0]]||{}).last===0),wk=Object.entries(bc).filter(e=>e[1][0]>=2).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0]).slice(0,3);
 $.innerHTML=nav('r')+`<h1>学習記録</h1><p>解いた問題数 <b>${N}</b>　正答率 <b>${pc(Cc,N)}</b></p><h2>教科別の成績</h2><table>${Object.keys(SUB).map(s=>`<tr><td>${s}</td><td>${(bs[s]||[0])[0]}問</td><td>${pc((bs[s]||[0,0])[1],(bs[s]||[0])[0])}</td></tr>`).join('')}</table><h2>苦手分野(2問以上解いた分野)</h2>${wk.length?`<table>${wk.map(([k,v])=>`<tr><td>${k}</td><td>${pc(v[1],v[0])}</td></tr>`).join('')}</table>`:'<p class="note">まだデータが足りません。</p>'}<h2>間違えた問題(${wr.length})</h2>${wr.map(r=>`<p>・${r[5]}<br><b class="good">${r[6][0]}${r[8]}</b></p>`).join('')||'<p class="note">ありません。</p>'}${wr.length?'<button class="main" data-a="redo">間違えた問題を解く</button>':''}<h2>記録の保存について</h2><p class="note">記録はこのiPhoneのSafariの中(localStorage・約5MB)に保存され、ブラウザを閉じても残ります。「履歴とWebサイトデータを消去」すると消えます。プライベートブラウズでは保存されず、長く開かないと自動で消えることもあるため、下のバックアップ文字列をメモなどに保管してください。</p><textarea id="bk" rows="3">${JSON.stringify(R)}</textarea><button class="alt" data-a="imp">この文字列から復元</button><p class="note">${hdn}</p>`;
}
$.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t||!t.dataset.a)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='t')v==='h'?home():v==='q'?setup():rec();
 else if(a==='hm'){C.src=new Set([v==='past'?'過去問':'類似問題']);setup()}
 else if(a==='hs'){C.s=v;C.cats.clear();setup()}
 else if(a==='s'){C.s=v;C.cats.clear();setup()}
 else if(a==='cat'){if(v==='すべて')C.cats.clear();else C.cats.has(v)?C.cats.delete(v):C.cats.add(v);setup()}
 else if(a==='n'){C.n=+v;setup()}
 else if(a==='lv'){C.lv=+v;setup()}
 else if(a==='src'){C.src.has(v)?C.src.delete(v):C.src.add(v);setup()}
 else if(a==='m'){C.m=+v;setup()}
 else if(a==='yr'){C.yr.has(v)?C.yr.delete(v):C.yr.add(v);setup()}
 else if(a==='od'){C.od=+v;setup()}
 else if(a==='go')begin(pick());
 else if(a==='ck')judge(document.getElementById('in').value,0);
 else if(a==='sh'){const r=L[i];t.disabled=true;document.getElementById('tx').disabled=true;document.getElementById('fb').innerHTML=`<p class="fb">正答例: ${r[6][0]}</p><p class="ex">${r[9]}</p><p class="fb">あなたの答えは合っていましたか?</p><div class="grid2"><button class="main" data-a="sg" data-v="1">合っていた</button><button class="alt" data-a="sg" data-v="0">違っていた</button></div>`}
 else if(a==='sg')judge(v==='1',2);
 else if(a==='o')judge(v,1);
 else if(a==='nx'){i++;i<L.length?show():result()}
 else if(a==='rt')begin(miss.slice());
 else if(a==='redo')begin(D.filter(r=>(R.log[r[0]]||{}).last===0));
 else if(a==='home')home();
 else if(a==='imp'){try{const x=JSON.parse(document.getElementById('bk').value);if(x&&x.log){R=x;save();hdn='復元しました。';rec()}}catch(er){hdn='復元できませんでした。文字列を確認してください。';rec()}}
});
$.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in'&&e.target.value&&!e.isComposing)judge(e.target.value,0)});
home();
